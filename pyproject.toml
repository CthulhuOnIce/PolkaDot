[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polkadot"
version = "0.1.0"
description = "Tools for ripping apart scanned city directories (R. L. Polk & Co. and similar) into structured business data and cropped image references."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.23",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.1",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
polkadot = "polkadot.cli:main"

[tool.setuptools.packages.find]
include = ["polkadot*"]

[tool.setuptools.package-data]
polkadot = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
